name: anti-parrot-regression

on:
  pull_request:
    paths:
      - novel_rule_solver.py
      - app.py
      - generator_runtime.py
      - tests/test_novel_rule_solver.py
      - tests/test_parrot_generator.py
      - .github/workflows/anti-parrot-regression.yml
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install normal backend requirements
        run: python -m pip install -r requirements.txt
      - name: Check compilation
        run: python -m py_compile novel_rule_solver.py app.py generator_runtime.py
      - name: Execute exact-rule and generation-echo regressions
        run: python -m unittest discover -s tests -p 'test_novel_rule_solver.py' -v && python -m unittest discover -s tests -p 'test_parrot_generator.py' -v
