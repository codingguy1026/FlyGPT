name: archived trained MaleCNS router compatibility

on:
  pull_request:
    paths:
      - 'router_runtime.py'
      - 'training/train_router.py'
      - 'scripts/enable_trained_router.sh'
      - 'scripts/disable_trained_router.sh'
      - 'tests/test_trained_residual_router.py'
      - '.github/workflows/trained-malecns-compat.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  checkpoint-load:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU-only PyTorch
        run: python -m pip install 'torch>=2.4,<3' --index-url https://download.pytorch.org/whl/cpu
      - name: Validate startup scripts syntax
        run: bash -n scripts/enable_trained_router.sh scripts/disable_trained_router.sh
      - name: Download original trained checkpoint (seed 44)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/flygpt-original artifacts
          gh run download 38858319727 -R codingguy1026/FlyGPT -n flygpt-research-only-trained-malecns -D /tmp/flygpt-original
          echo '06642d649163b6636ed3b70069a9fafcc7fcc91c7fa37850a35ba82df2cb4c46  /tmp/flygpt-original/male_cns_seed44.pt' | sha256sum -c -
          cp /tmp/flygpt-original/male_cns_seed44.pt artifacts/fly_router_malecns_residual_seed44.pt
          echo "FLYGPT_TEST_RESIDUAL_CKPT=$PWD/artifacts/fly_router_malecns_residual_seed44.pt" >> "$GITHUB_ENV"
      - name: Verify authentic graph and exact training/inference agreement
        run: python -m unittest tests.test_trained_residual_router tests.test_router_live_frames tests.test_role_aware_router -v
      - name: Do not deploy automatically
        run: echo '✅ Model is compatible with opt-in FlyGPT runtime; manual activation required.'
