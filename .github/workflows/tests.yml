name: tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          # All-neuron policy tests were introduced with v0.5 and need CPU PyTorch.
          python -m pip install 'torch>=2.4,<3' --index-url https://download.pytorch.org/whl/cpu
      - name: Check launcher syntax
        run: bash -n scripts/enable_papiti_v05.sh scripts/disable_papiti_v05.sh scripts/run_all.sh scripts/run_backend_v0_7_local.sh scripts/setup_train_env.sh training/train_malecns_v0_4.sh training/train_malecns_v0_5.sh
      - name: Check Python syntax
        run: python -m py_compile training/train_router.py training/eval_router.py router_runtime.py papiti_v05_runtime.py papiti_v05_chat.py route_learning.py knowledge_store.py research_runtime.py dispatcher.py app.py scripts/diagnose_codespaces.py scripts/check_stability.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Build frontend
        working-directory: frontend
        run: npm run build
