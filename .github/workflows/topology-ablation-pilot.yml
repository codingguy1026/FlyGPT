name: MaleCNS topology ablation study

on:
  pull_request:
    paths:
      - "training/topology_ablation.py"
      - "tests/test_topology_ablation.py"
      - ".github/workflows/topology-ablation-pilot.yml"
  workflow_dispatch:

jobs:
  ablation-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Syntax and graph-invariant unit tests
        run: |
          python -m py_compile training/topology_ablation.py
          python -m unittest tests.test_topology_ablation -v
      - name: Train paired models on original and rewired graphs
        run: |
          python training/topology_ablation.py \
            --seeds 42 43 44 \
            --epochs 90 \
            --patience 18 \
            --out /tmp/topology-ablation-replicated.json
      - name: Save report (never deploy experimental checkpoints)
        uses: actions/upload-artifact@v4
        with:
          name: topology-ablation-replicated
          path: /tmp/topology-ablation-replicated.json
          retention-days: 30
