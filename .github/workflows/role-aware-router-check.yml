name: role-aware-router-check

on:
  pull_request:
    paths:
      - training/train_router.py
      - training/role_prior.py
      - router_runtime.py
      - tests/test_role_aware_router.py
      - tests/test_router_live_frames.py
      - .github/workflows/role-aware-router-check.yml
  workflow_dispatch:

jobs:
  pytorch-role-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU-only PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Validate script syntax
        run: |
          python -m py_compile training/train_router.py training/role_prior.py training/build_role_labels.py training/compare_role_aware.py router_runtime.py
          bash -n training/train_malecns_v0_5.sh
      - name: Check original and role-aware forward/trace invariants
        run: python -m unittest tests.test_role_aware_router tests.test_router_live_frames -v
