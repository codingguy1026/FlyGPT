name: Papiti v0.6.1 Hybrid neural speech and meaning guard

on:
  pull_request:
    paths:
      - "papiti_lm/**"
      - "generator_runtime.py"
      - "hybrid_speech.py"
      - "scripts/run_all.sh"
      - "Makefile"
      - "tests/test_hybrid_voice.py"
      - "tests/test_papiti_v0_6_1.py"
      - ".github/workflows/papiti-v0-6-1-speech.yml"
  push:
    branches: [main]
    paths:
      - "papiti_lm/**"
      - "generator_runtime.py"
      - "hybrid_speech.py"
      - "scripts/run_all.sh"
      - "Makefile"
      - "tests/test_hybrid_voice.py"
      - "tests/test_papiti_v0_6_1.py"
      - ".github/workflows/papiti-v0-6-1-speech.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-only-speech:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install small Transformer dependencies (no hosted models)
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.4,<3'
          python -m pip install fastapi uvicorn
      - name: Check Hybrid brain-to-speech contract and old regressions
        run: |
          python -m unittest tests.test_papiti_v0_6_1 tests.test_hybrid_voice tests.test_brain_runtime tests.test_papiti_lm tests.test_papiti_v0_6 -v
      - name: Train a fresh, conditional v0.6.1 language speaker
        run: |
          python -m papiti_lm.v0_6_1 train \
            --epochs 12 --patience 5 \
            --checkpoint artifacts/papiti_language_v0_6_1.pt
      - name: Evaluate unseen semantics and preserve actual model failures
        run: |
          mkdir -p reports
          python -m papiti_lm.v0_6_1 eval \
            --checkpoint artifacts/papiti_language_v0_6_1.pt \
            --report reports/papiti_v0_6_1.json > reports/papiti_v0_6_1.log
          python - <<'PY'
          import json
          report=json.load(open('reports/papiti_v0_6_1.json', encoding='utf-8'))
          print('UNSEEN exact matches:', report['unseen_exact_match_count'], '/', report['test_count'])
          print('LOSS:', report['test_metrics'])
          for row in report['test_generations'][:5]:
              print(row)
          print('Research-only, NOT release-ready:', not report['release_ready'])
          PY
      - name: Exercise ACTUAL Hybrid with trained checkpoint (not mocks)
        run: |
          python - <<'PY'
          import json, os, sys
          from brain_runtime import FlyBrainRuntime
          from generator_runtime import GeneratorRuntime
          os.environ.update({
              "FLYGPT_GENERATOR_MODE": "hybrid",
              "FLYGPT_HYBRID_SPEAKER": "v0.6.1",
              "FLYGPT_HYBRID_SPEECH_PYTHON": sys.executable,
              "FLYGPT_HYBRID_SPEECH_CHECKPOINT": "artifacts/papiti_language_v0_6_1.pt",
          })
          brain, runtime = FlyBrainRuntime(), GeneratorRuntime()
          accepted=0
          for text in ("안녕", "고마워", "잘 가", "너 누구야?"):
              state=brain.plan(
                  route_info={"route":"general","accepted":True,"confidence":0.95,"margin":0.8},
                  dispatch={"route":"general"}, message=text,
              )
              state=brain.finalize(state)
              result=runtime.generate(text, "general", brain_state=state)
              print(json.dumps({"prompt":text,"provider":result.provider,
                                "answer":result.answer,"finish_reason":result.finish_reason,
                                "fallback_reason":result.error}, ensure_ascii=False), flush=True)
              accepted += result.provider=="papiti-hybrid-v0.6.1"
          print("REAL NEURAL HYBRID ACCEPTED:",accepted, "/4", flush=True)
          assert accepted>0, "Model did not produce any accepted social replies; fix training before merge"
          PY
      - name: Publish short-lived model checkpoint and inspection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: papiti-v0-6-1-hybrid-speech-evidence
          path: |
            artifacts/papiti_language_v0_6_1.pt
            reports/papiti_v0_6_1.json
            reports/papiti_v0_6_1.log
          if-no-files-found: warn
          retention-days: 7
