name: train full MaleCNS and compare 93-percent grouped holdout

on:
  pull_request:
    paths:
      - '.github/workflows/train-all-neurons.yml'
      - 'training/grouped_corpus.py'
      - 'training/full_population_router.py'
      - 'training/full_population_benchmark.py'
      - 'training/train_full_connectome.py'
      - 'tests/test_full_population_router.py'
  workflow_dispatch:

concurrency:
  group: male-cns-full-structural-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  full-anatomy-training:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: CPU PyTorch, NumPy and PyArrow
        run: |
          python -m pip install 'torch>=2.4,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy>=1.26,<3' 'pyarrow>=15,<23'
      - name: Check program and science-invariant tests
        run: |
          python -m py_compile training/grouped_corpus.py training/full_population_router.py training/full_population_benchmark.py training/train_full_connectome.py
          python -m unittest tests.test_full_population_router -v
      - name: Download frozen 256-neuron research references
        run: |
          mkdir -p /tmp/fly-256
          gh run download 38858319727 -R codingguy1026/FlyGPT -n flygpt-research-only-trained-malecns -D /tmp/fly-256
          echo '06642d649163b6636ed3b70069a9fafcc7fcc91c7fa37850a35ba82df2cb4c46  /tmp/fly-256/male_cns_seed44.pt' | sha256sum -c -
          ls -lh /tmp/fly-256/
      - name: Download all official MaleCNS connectivity and neuronal annotations
        run: |
          bash scripts/download_all_malecns_data.sh
          ls -lh data/malecns_full/*.feather
      - name: Pretrain entire official directed neuronal connection graph
        run: |
          python training/train_full_connectome.py --epochs 1 --embedding-dim 16 --batch-size 32768 --progress-every 500 --out /tmp/malecns-structural-all.pt
          test -s /tmp/malecns-structural-all.pt
      - name: Compare 3 new full-population models against original 93%-study
        run: |
          python training/full_population_benchmark.py \
            --structural /tmp/malecns-structural-all.pt \
            --baseline-dir /tmp/fly-256 \
            --seeds 42 43 44 \
            --epochs 90 \
            --patience 18 \
            --batch-size 32 \
            --output /tmp/full-pop-models \
            --report /tmp/full-pop-report.json
      - name: Attach actual scores and neuronal coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-full-MaleCNS-93-study-report
          path: /tmp/full-pop-report.json
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve all trained full-neuron experimental models
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: real-full-MaleCNS-3-seed-models
          path: /tmp/full-pop-models/*.pt
          retention-days: 30
      - name: Report that production remains unchanged
        if: always()
        run: echo 'Research-only architecture and checkpoints. NO deployed FlyGPT model has been changed.'
