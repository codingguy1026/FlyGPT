name: Papiti v0.5 model-only learned Korean and math

on:
  pull_request:
    paths:
      - "papiti_lm/**"
      - "tests/test_papiti_lm.py"
      - "Makefile"
      - ".github/workflows/papiti-v0-5-train.yml"
  push:
    branches: [main]
    paths:
      - "papiti_lm/**"
      - "tests/test_papiti_lm.py"
      - "Makefile"
      - ".github/workflows/papiti-v0-5-train.yml"
  workflow_dispatch:

jobs:
  model-only-training:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch and test dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install fastapi uvicorn
      - name: Test disjointness, digit BPE, checkpoint and genuine model-only responses
        run: python -m unittest tests.test_papiti_lm -v
      - name: Train scratch Transformer without runtime calculator or fixed answers
        run: |
          python -m papiti_lm.v0_5 train \
            --data training/papiti_dialogues_v0_3.jsonl \
            --checkpoint artifacts/papiti_language_v0_5.pt \
            --epochs 22 --patience 7 --batch-size 24 \
            --math-train 3000 --math-valid 160 \
            --d-model 160 --heads 5 --layers 3 \
            --seed 42
      - name: Evaluate on UNSEEN arithmetic operand pairs and language groups
        run: |
          python -m papiti_lm.v0_5 eval \
            --data training/papiti_dialogues_v0_3.jsonl \
            --checkpoint artifacts/papiti_language_v0_5.pt \
            --extra-probes 24
      - name: Show actual learned responses (no calculator)
        run: |
          echo "NEURAL OUTPUT: 1+1은?"
          python -m papiti_lm.v0_5 chat \
            --checkpoint artifacts/papiti_language_v0_5.pt \
            --message "1+1은?" --temperature 0 --max-new-tokens 12
          echo "NEURAL OUTPUT: 23+47은?"
          python -m papiti_lm.v0_5 chat \
            --checkpoint artifacts/papiti_language_v0_5.pt \
            --message "23+47은?" --temperature 0 --max-new-tokens 12
          echo "NEURAL OUTPUT: 고마워"
          python -m papiti_lm.v0_5 chat \
            --checkpoint artifacts/papiti_language_v0_5.pt \
            --message "고마워" --temperature 0 --max-new-tokens 48
      - name: Upload trained v0.5 neural-only weights
        uses: actions/upload-artifact@v4
        with:
          name: papiti-v0-5-model-only-trained-weights
          path: artifacts/papiti_language_v0_5.pt
          if-no-files-found: error
          retention-days: 7
