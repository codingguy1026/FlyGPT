name: verify full-neuron routing architecture

on:
  pull_request:
    paths:
      - 'training/full_population_router.py'
      - 'full_population_runtime.py'
      - 'app.py'
      - 'frontend/components/BrainPanel.tsx'
      - 'frontend/lib/api.ts'
      - 'tests/test_full_population_router.py'
      - 'scripts/*full*neuron*.sh'
      - '.github/workflows/full-neuron-architecture.yml'
  workflow_dispatch:

jobs:
  safety-and-math:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU-only torch for synthetic math checks
        run: python -m pip install 'torch>=2.4,<3' --index-url https://download.pytorch.org/whl/cpu
      - name: Check code and offline tool syntax
        run: |
          python -m py_compile training/full_population_router.py full_population_runtime.py app.py
          bash -n scripts/download_all_malecns_data.sh scripts/train_full_population_router.sh scripts/enable_full_neuron_router.sh scripts/disable_full_neuron_router.sh
      - name: Verify exact all-neuron moment identity and non-sampling invariant
        run: python -m unittest tests.test_full_population_router -v
      - name: Announce that no production or bulk data was used
        run: echo 'Structural and synthetic unit tests only. Requires 1.1GB official full data and separately trained checkpoint before opt-in deployment.'
